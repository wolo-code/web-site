<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title desc" role="img" version="1.1" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
	<title id="title">Technical Paper</title>
	<desc id="desc">An academic paper document with mathematical equations, coordinate grid, and location code symbols.</desc>
	<defs>
		<linearGradient id="bg" y2="1">
			<stop stop-color="#f6f1e8" offset="0"/>
			<stop stop-color="#e0eef1" offset="1"/>
		</linearGradient>
	</defs>
	<rect width="1600" height="900" fill="url(#bg)"/>
	<!-- Document shadow / back sheet -->
	<rect x="490" y="110" width="640" height="690" rx="28" fill="#d9edf2" stroke="#56b4d1" stroke-linejoin="round" stroke-width="12"/>
	<!-- Main paper sheet -->
	<rect x="460" y="80" width="640" height="690" rx="28" fill="#ffffff" stroke="#40516f" stroke-linejoin="round" stroke-width="16"/>
	<!-- Header title bar -->
	<rect x="520" y="140" width="380" height="28" rx="8" fill="#56b4d1"/>
	<rect x="520" y="185" width="220" height="14" rx="4" fill="#a0b8c4"/>
	<line x1="520" y1="225" x2="1040" y2="225" stroke="#e0eef1" stroke-width="4"/>
	<!-- Abstract box -->
	<rect x="520" y="250" width="520" height="85" rx="10" fill="#f8fafc" stroke="#d9edf2" stroke-width="4"/>
	<rect x="540" y="270" width="480" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="540" y="292" width="420" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="540" y="314" width="340" height="10" rx="4" fill="#cbd5e1"/>
	<!-- Column 1: Grid diagram & text -->
	<rect x="520" y="360" width="240" height="160" rx="12" fill="#eef7fa" stroke="#56b4d1" stroke-width="6"/>
	<!-- Grid inside diagram -->
	<line x1="550" y1="390" x2="730" y2="390" stroke="#56b4d1" stroke-width="3" stroke-dasharray="4,4"/>
	<line x1="550" y1="440" x2="730" y2="440" stroke="#56b4d1" stroke-width="3"/>
	<line x1="550" y1="490" x2="730" y2="490" stroke="#56b4d1" stroke-width="3" stroke-dasharray="4,4"/>
	<line x1="590" y1="380" x2="590" y2="500" stroke="#56b4d1" stroke-width="3" stroke-dasharray="4,4"/>
	<line x1="640" y1="380" x2="640" y2="500" stroke="#56b4d1" stroke-width="3"/>
	<line x1="690" y1="380" x2="690" y2="500" stroke="#56b4d1" stroke-width="3" stroke-dasharray="4,4"/>
	<circle cx="640" cy="440" r="10" fill="#d0a85c"/>
	<circle cx="640" cy="440" r="45" fill="none" stroke="#40516f" stroke-width="3" stroke-dasharray="6,4"/>
	<!-- Text below grid -->
	<rect x="520" y="540" width="240" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="520" y="562" width="220" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="520" y="584" width="190" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="520" y="606" width="230" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="520" y="628" width="160" height="10" rx="4" fill="#cbd5e1"/>
	<!-- Column 2: Formulas & equations -->
	<rect x="790" y="360" width="250" height="90" rx="10" fill="#f8fafc" stroke="#d9edf2" stroke-width="4"/>
	<!-- Math formula representation: N = 2^15 = 32768 -->
	<text x="820" y="405" font-family="'Times New Roman', serif" font-style="italic" font-size="28" fill="#40516f">N = 2<tspan dy="-12" font-size="18">15</tspan><tspan dy="12" font-size="28"> = 32,768</tspan></text>
	<rect x="790" y="475" width="250" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="790" y="497" width="230" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="790" y="519" width="250" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="790" y="541" width="210" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="790" y="563" width="240" height="10" rx="4" fill="#cbd5e1"/>
	<rect x="790" y="585" width="180" height="10" rx="4" fill="#cbd5e1"/>
	<!-- IEEE badge / Seal -->
	<g transform="translate(980, 640)">
		<circle cx="50" cy="50" r="50" fill="#d9edf2" stroke="#40516f" stroke-width="8"/>
		<circle cx="50" cy="50" r="38" fill="#56b4d1"/>
		<path d="M35 50 L45 62 L68 36" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
		<path d="M28 88 L14 135 L50 115 L86 135 L72 88" fill="#d0a85c" stroke="#40516f" stroke-linejoin="round" stroke-width="6"/>
	</g>
</svg>
